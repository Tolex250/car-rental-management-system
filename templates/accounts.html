{% extends 'base.html' %}{% block content %}<p class="eyebrow">ACCESS MANAGEMENT</p><h1>Accounts and roles</h1><div class="table-wrap"><table><tr><th>Account</th><th>Roles</th><th>Active</th><th></th></tr>{% for u in accounts %}<tr><td>{{ u.username }}<small>{{ u.get_full_name }}</small></td><td>{% for g in u.groups.all %}{{ g.name }} {% endfor %}</td><td>{{ u.is_active|yesno:'Yes,No' }}</td><td><a href="{% url 'account_edit' u.pk %}">Edit access</a></td></tr>{% endfor %}</table></div>{% endblock %}
