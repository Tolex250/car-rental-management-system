<div class="table-wrap"><table><thead><tr><th>Booking</th><th>Vehicle</th><th>Collection</th><th>Return</th><th>Status</th><th></th></tr></thead><tbody>{% for b in bookings %}<tr><td>{{ b }}</td><td>{{ b.vehicle.name }}<small>{{ b.vehicle.registration }}</small></td><td>{{ b.start|date:'d M Y H:i' }}</td><td>{{ b.end|date:'d M Y H:i' }}</td><td><span class="status {{ b.status }}">{{ b.get_status_display }}</span></td><td><a href="{% url 'booking_detail' b.pk %}">Open</a></td></tr>{% empty %}<tr><td colspan="6" class="empty">No bookings yet. Your rental activity will appear here.</td></tr>{% endfor %}</tbody></table></div>
